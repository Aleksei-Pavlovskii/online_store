{% extends 'catalog/base.html' %}
{% load my_tags %}

{% block content %}
<div class="container">
    <h1 class="mb-4">Удалить продукт</h1>
    <p>Вы уверены, что хотите удалить "{{ product.name }}"</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'catalog:product_list' %}">Отмена</a>
    </form>
</div>
{% endblock %}
